name: Keep Supabase Alive

on:
  schedule:
    # Runs every day at 6:00 AM UTC — daily, to prevent Supabase free-tier
    # auto-pause from inactivity. Queries the users table for real DB activity.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # lets you manually trigger it from the Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase table (real DB activity)
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/users?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
